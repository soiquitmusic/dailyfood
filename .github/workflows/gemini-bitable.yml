name: Feishu-Bitable-Gemini

on:
  # 飞书多维表格「按钮字段」→ 自动化流程 → GitHub API 唤醒（按需、实时）
  repository_dispatch:
    types: [feishu_bitable]
  # 手动触发，用于测试
  workflow_dispatch:
  # 想恢复自动轮询？取消下面三行注释（GitHub 的 cron 使用 UTC 时间）：
  # schedule:
  #   - cron: "*/10 * * * *"

jobs:
  gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 识别卡路里并回填多维表格
        run: python main.py
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_TABLE_ID: ${{ secrets.BITABLE_TABLE_ID }}
          # 飞书按钮的自动化流程通过 client_payload 传入，限定只处理某一餐（如 午餐/晚餐）
          MEAL: ${{ github.event.client_payload.meal }}
