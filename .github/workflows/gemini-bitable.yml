name: Feishu-Bitable-Gemini

on:
  # 定时自动扫描（最轻量方案）：每 5 分钟处理一次「卡路里为空」的记录，无需按钮/HTTP
  schedule:
    - cron: "*/5 * * * *"
  # 飞书按钮即时触发（可选，想保留"点一下立刻处理"就留着；不需要可以删掉）
  repository_dispatch:
    types: [feishu_bitable]
  # 手动触发，用于测试
  workflow_dispatch:

jobs:
  gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 识别卡路里并回填多维表格
        run: python main.py
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_TABLE_ID: ${{ secrets.BITABLE_TABLE_ID }}
          # 飞书按钮的自动化流程通过 client_payload 传入，限定只处理某一餐（如 午餐/晚餐）
          MEAL: ${{ github.event.client_payload.meal }}
